<meta name="robots" content="noindex, nofollow">
<style id="pw-gate-style">
html.pw-locked body{visibility:hidden}
#pw-gate{visibility:visible;position:fixed;inset:0;z-index:2147483000;background:#f6f6f7;display:flex;align-items:center;justify-content:center;padding:16px;font-family:'Microsoft JhengHei','微軟正黑體','PingFang TC','Heiti TC',system-ui,sans-serif;color:#0f172a}
#pw-gate form{width:min(420px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:40px 36px 40px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,23,42,.04)}
#pw-gate h1{margin:0 0 32px;text-align:center;font-size:26px;font-weight:900;line-height:1.4;color:#9a0036;letter-spacing:.02em}
#pw-gate .pw-field{position:relative}
#pw-gate input{display:block;height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:0 54px 0 16px;font:inherit;font-size:16px;color:#0f172a;background:#fff;width:100%;box-sizing:border-box;outline:none;transition:border-color .15s}
#pw-gate input::placeholder{color:#64748b}
#pw-gate input:focus{border-color:#9a0036}
#pw-gate .pw-eye{position:absolute;right:6px;top:5px;width:40px;height:40px;border:none;border-radius:10px;background:transparent;color:#64748b;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#pw-gate .pw-eye:hover{color:#0f172a;background:#f1f5f9}
#pw-gate .pw-eye:focus-visible{outline:2px solid #9a0036;outline-offset:1px}
#pw-gate .pw-err{min-height:26px;padding-top:6px;font-size:14px;font-weight:700;color:#b42318}
#pw-gate .pw-submit{height:50px;border:none;border-radius:12px;background:#9a0036;color:#fff;font:inherit;font-size:17px;font-weight:700;letter-spacing:.1em;cursor:pointer;margin-top:4px}
#pw-gate .pw-submit:hover{background:#7f002d}
#pw-gate .pw-submit:focus-visible{outline:3px solid #9a0036;outline-offset:2px}
@media (max-width:440px){#pw-gate form{padding:32px 22px}#pw-gate h1{font-size:23px;margin-bottom:26px}}
</style>
<script id="pw-gate-script">
(function(){
  var KEY='fx-idea-shop-pass', HASH='54430469488bb765a72b6229aec0378de6ba2cae4d80355d40a31dfa51e46522';
  var EYE='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', EYEOFF='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.73 5.08A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-1.67 2.68M6.61 6.61A18.4 18.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.39-1.61M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="m2 2 20 20"/></svg>';
  var ok=false; try{ok=sessionStorage.getItem(KEY)===HASH}catch(e){}
  if(ok) return;
  document.documentElement.classList.add('pw-locked');
  function sha(s){ if(!(window.crypto&&crypto.subtle)) return Promise.reject(); return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}) }
  function build(){
    var g=document.createElement('div'); g.id='pw-gate';
    g.innerHTML='<form novalidate><h1>外匯體驗點子商城</h1><label for="pw-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">密碼</label><div class="pw-field"><input id="pw-input" type="password" autocomplete="current-password" placeholder="請輸入密碼"><button type="button" class="pw-eye" id="pw-eye" aria-label="顯示密碼" aria-pressed="false">'+EYEOFF+'</button></div><div class="pw-err" id="pw-err" role="alert"></div><button type="submit" class="pw-submit">登入</button></form>';
    document.body.appendChild(g);
    var f=g.querySelector('form'), inp=g.querySelector('#pw-input'), err=g.querySelector('#pw-err'), eye=g.querySelector('#pw-eye');
    eye.addEventListener('click',function(){ var show=inp.type==='password'; inp.type=show?'text':'password'; eye.setAttribute('aria-pressed',String(show)); eye.setAttribute('aria-label',show?'隱藏密碼':'顯示密碼'); eye.innerHTML=show?EYE:EYEOFF; inp.focus(); });
    f.addEventListener('submit',function(e){
      e.preventDefault(); err.textContent='';
      sha(inp.value).then(function(h){
        if(h===HASH){ try{sessionStorage.setItem(KEY,HASH)}catch(e){} g.remove(); document.documentElement.classList.remove('pw-locked'); }
        else { err.textContent='密碼錯誤，請再試一次。'; inp.focus(); inp.select(); }
      },function(){ err.textContent='此瀏覽器無法驗證密碼，請改用其他瀏覽器。'; });
    });
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臺灣銀行｜外匯體驗點子商城</title>
<style>
  :root {
    --accent: #9a0036;        /* CI 主色 */
    --accent-soft: #f7e9ee;
    --ink: #0f172a;
    --text: #334155;
    --muted: #475569;
    --faint: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --ground: #f6f6f7;
    --panel: #f8fafc;
    --star: #b45309;

  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {

    background: var(--ground);
    color: var(--ink);
    font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', 'Heiti TC', system-ui, -apple-system, 'Segoe UI', sans-serif;

  }
  body.drawer-open { overflow: hidden; }
  a { color: var(--accent); }
  button, input { font-family: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, [role="option"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1440px; margin: 0 auto; padding-left: 64px; padding-right: 64px; }

  /* ---------- Header ---------- */
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .header-row { display: flex; align-items: center; gap: 12px 20px; padding-top: 14px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); margin-right: auto; }
  .brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-text small { font-size: 12px; color: var(--muted); }
  .brand-text strong { font-size: 24px; font-weight: 900; letter-spacing: .02em; }
  .search { width: 320px; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--ground); }
  .search:focus-within { border-color: var(--ink); background: #fff; }

  /* ---------- 標題 ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 28px; }

  .count { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; color: var(--muted); }
  .count strong { color: var(--ink); font-size: 18px; }
  .search-chip { min-height: 32px; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: #fff; font-size: 13px; color: var(--text); cursor: pointer; }
  .search-chip:hover { border-color: var(--ink); }
  .search-chip .x { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--muted); }

  /* ---------- 篩選面板 ---------- */
  .filters { margin-top: 20px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; }
  .filter-row { display: flex; align-items: center; gap: 12px 20px; }
  .filter-row + .filter-row { padding-top: 18px; border-top: 1px solid var(--line); }

  .chip:hover { border-color: var(--ink); }

  .chip[aria-pressed="true"] .n { background: var(--accent-soft); color: var(--accent); }

  .stars-range { display: flex; touch-action: none; user-select: none; -webkit-user-select: none; }

  .range-pill { font-size: 13px; font-weight: 700; color: var(--text); background: #f1f5f9; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .segmented { display: flex; padding: 3px; border-radius: 12px; background: #f1f5f9; }
  .seg { min-height: 40px; padding: 0 16px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; }
  .seg:hover { color: var(--ink); }
  .seg[aria-pressed="true"] { background: #fff; color: var(--accent); font-weight: 900; box-shadow: 0 1px 4px rgba(15,23,42,.15); }
  .clear-link { border: none; background: none; padding: 0 4px; min-height: 44px; color: var(--muted); font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .clear-link:hover { color: var(--ink); }


  /* ---------- 卡片 ---------- */
  main { padding-top: 24px; padding-bottom: 56px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }

  .card:hover { box-shadow: 0 12px 28px rgba(15,23,42,.10); transform: translateY(-2px); }

  .card-img .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: transform .25s, color .25s; }
  .card:hover .card-img .icon { transform: scale(1.08); color: var(--ink); }
  .card-img .thumb { position: absolute; left: 50%; bottom: 0; height: 134px; width: auto; transform: translateX(-50%); filter: drop-shadow(0 8px 16px rgba(15,23,42,.18)); transition: transform .25s; }
  .card:hover .card-img .thumb { transform: translateX(-50%) translateY(-4px); }
  .tag-cat { z-index: 1; position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 700; color: var(--ink); background: #fff; padding: 5px 10px; border-radius: 999px; }
  .tag-proto { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); padding: 5px 10px; border-radius: 999px; }
  .tag-proto.plan { color: var(--muted); background: #fff; border: 1px dashed var(--line-strong); padding: 4px 9px; }
  div.card-img .icon { color: #94a3b8; }

  .tag-with { position: absolute; bottom: 12px; right: 12px; font-size: 12px; font-weight: 700; color: var(--ink); background: #fff; padding: 4px 10px; border-radius: 999px; }
  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .platform { font-size: 12px; font-weight: 700; color: var(--accent); background: #fff; border: 1px solid var(--accent); padding: 1px 8px; border-radius: 6px; }

  .co-stat span { font-size: 13px; color: var(--muted); }

  .co-list-head h2 { margin: 0; font-size: 20px; font-weight: 900; }

  .co-no { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

  const PLATFORMS = ['APP', '網銀', '官網', 'ATM'];
  const SORTS = [
    { id: 'category', label: '依類別排序', short: '依類別' },
    { id: 'easy', label: '難易度：低 → 高', short: '難易度 低→高', chip: '難易度 低→高' },
    { id: 'hard', label: '難易度：高 → 低', short: '高→低', chip: '難易度 高→低' }

  const STAR_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
  const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  // 評估清單存在瀏覽器暫存，重新整理後保留
  const PICK_KEY = 'fx-idea-shop-tokens-v2';
  const TOKEN_TOTAL = 1000, TOKEN_STEP = 50;
  function loadPicked() {
    try {
      const v = JSON.parse(localStorage.getItem(PICK_KEY));
      if (v && Array.isArray(v.picked)) {
        const picked = v.picked.filter(id => ITEMS.some(it => it.id === id) && v.tokens[id] > 0);
        const tokens = {}; picked.forEach(id => tokens[id] = Math.floor(v.tokens[id]));
        if (picked.reduce((s, id) => s + tokens[id], 0) <= TOKEN_TOTAL) return { picked, tokens };
      }
    } catch (e) {}
    return { picked: [], tokens: {} };
  }
  function savePicked() { try { localStorage.setItem(PICK_KEY, JSON.stringify({ picked: state.picked, tokens: state.tokens })); } catch (e) {} }

  const saved = loadPicked();
  const state = { cats: [], diffMin: 0, diffMax: 0, platforms: [], sort: 'category', q: '', picked: saved.picked, tokens: saved.tokens };
  const usedTokens = () => state.picked.reduce((s, id) => s + (state.tokens[id] || 0), 0);
  const leftTokens = () => TOKEN_TOTAL - usedTokens();
  const byId = Object.fromEntries(ITEMS.map(it => [it.id, it]));
  const $ = id => document.getElementById(id);
  const COIN_SVG = document.querySelector('#token-chip svg').outerHTML;
  const fmtN = n => Number(n).toLocaleString('en-US');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const starsText = n => `<span class="on">${'★'.repeat(n)}</span><span class="off">${'★'.repeat(5 - n)}</span>`;
  const iconSvg = (cat, size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${CAT_ICONS[cat]}"/></svg>`;
  const hasFilter = () => state.cats.length || state.diffMin || state.platforms.length || state.sort !== 'category' || state.q.trim();

  /* ---------- 建立控制項 ---------- */
  function buildControls() {
    $('cat-filters').innerHTML = [`<button class="cat-tab" type="button" data-cat="__all" aria-pressed="false">全部<span class="n">${ITEMS.length}</span></button>`]
      .concat(CATEGORIES.map(c => { const n = ITEMS.filter(it => it.cat === c).length; return `<button class="cat-tab" type="button" data-cat="${c}" aria-pressed="false" ${n ? '' : 'disabled'}>${c}<span class="n">${n}</span></button>`; }))
      .join('');
    $('stars-range').innerHTML = [1, 2, 3, 4, 5].map(n =>
      `<button class="star-btn" type="button" data-star="${n}" aria-label="${n} 星" aria-pressed="false">${STAR_SVG}</button>`).join('');
    $('platform-filters').innerHTML = PLATFORMS.map(p =>
      `<button class="pf-chip" type="button" data-platform="${p}" aria-pressed="false">${p}</button>`).join('');
    $('sort-seg').innerHTML = SORTS.map(o =>
      `<button class="seg" type="button" data-sortopt="${o.id}" aria-label="${o.label}" aria-pressed="false">${o.short}</button>`).join('');
  }

  function rangeLabel() {
    if (!state.diffMin) return '全部';
    return state.diffMax === 1 ? '1 星' : `1–${state.diffMax} 星`;
  }

  function paintStars(min, max, preview) {
    document.querySelectorAll('.star-btn').forEach(b => {
      const n = +b.dataset.star;
      const inRange = !!min && n >= min && n <= max;
      b.classList.toggle('on', inRange && !preview);
      b.classList.toggle('preview', inRange && preview);
      b.setAttribute('aria-pressed', !!(state.diffMin && n >= state.diffMin && n <= state.diffMax));
    });
  }

  function syncControls() {
    document.querySelectorAll('[data-cat]').forEach(b => {
      const on = b.dataset.cat === '__all' ? state.cats.length === 0 : state.cats.includes(b.dataset.cat);
      b.setAttribute('aria-pressed', on);
    });
    document.querySelectorAll('[data-platform]').forEach(b => b.setAttribute('aria-pressed', state.platforms.includes(b.dataset.platform)));
    paintStars(state.diffMin, state.diffMax, false);
    $('range-pill').textContent = rangeLabel();
    $('clear-filters').hidden = !hasFilter();
    const nf = (state.diffMin ? 1 : 0) + state.platforms.length + (state.sort !== 'category' ? 1 : 0);
    $('filter-n').hidden = !nf; $('filter-n').textContent = nf;
    $('filter-btn').classList.toggle('on', nf > 0);
    $('filter-btn').setAttribute('aria-label', nf ? `篩選與排序，已套用 ${nf} 個條件` : '篩選與排序');
    const sortOpt = SORTS.find(o => o.id === state.sort);
    $('active-chips').innerHTML = (state.sort !== 'category' ? [`<button class="a-chip" type="button" data-clear="sort" aria-label="移除排序：${sortOpt.label}，改回依類別排序">${sortOpt.chip}<span class="x" aria-hidden="true">✕</span></button>`] : []).concat(state.diffMin ? [`<button class="a-chip" type="button" data-clear="diff" aria-label="移除條件：難易度 ${rangeLabel()}">難易度 ${rangeLabel()}<span class="x" aria-hidden="true">✕</span></button>`] : [])
      .concat(state.platforms.map(p => `<button class="a-chip" type="button" data-rmplat="${p}" aria-label="移除條件：${p}">${p}<span class="x" aria-hidden="true">✕</span></button>`)).join('');
    document.querySelectorAll('[data-sortopt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sortopt === state.sort));
  }

  /* ---------- 星等點選／拖拉 ---------- */
  (function setupStarRange() {
    // 點第 n 顆星 = 篩選 1～n 星（前面的星一起亮起）；再點同一顆取消；可按住拖拉調整
    const box = $('stars-range');
    let dragging = false, end = 0;
    const starAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest('.star-btn'); return b && box.contains(b) ? +b.dataset.star : 0; };
    const choose = n => {
      if (state.diffMin === 1 && state.diffMax === n) state.diffMin = state.diffMax = 0;
      else { state.diffMin = 1; state.diffMax = n; }
      render();
    };
    box.addEventListener('pointerdown', e => {
      const b = e.target.closest('.star-btn'); if (!b) return;
      e.preventDefault();
      dragging = true; end = +b.dataset.star;
      box.setPointerCapture(e.pointerId);
      paintStars(1, end, true);
    });
    box.addEventListener('pointermove', e => {
      if (!dragging) return;
      const n = starAt(e.clientX, e.clientY);
      if (n && n !== end) { end = n; paintStars(1, end, true); }
    });
    const finish = () => { if (!dragging) return; dragging = false; choose(end); };
    box.addEventListener('pointerup', finish);
    box.addEventListener('pointercancel', () => { dragging = false; syncControls(); });
    // 鍵盤：Enter／空白鍵
    box.addEventListener('click', e => {
      if (e.detail !== 0) return;
      const b = e.target.closest('.star-btn'); if (b) choose(+b.dataset.star);
    });
  })();

  /* ---------- 篩選與排序 ---------- */
  function filtered() {
    const q = state.q.trim().toLowerCase();
    let list = ITEMS.filter(it => {
      if (state.cats.length && !state.cats.includes(it.cat)) return false;
      if (state.diffMin && (it.diff < state.diffMin || it.diff > state.diffMax)) return false;
      if (state.platforms.length && !state.platforms.some(p => it.platforms.includes(p))) return false;
      if (q && !(it.title + it.summary + it.features.join('') + it.benefit + it.cat).toLowerCase().includes(q)) return false;
      return true;
    });
    const jIndex = it => JOURNEY_ORDER.indexOf(it.j);
    const cIndex = it => CATEGORIES.indexOf(it.cat);
    const byCat = (a, b) => cIndex(a) - cIndex(b) || jIndex(a) - jIndex(b);
    if (state.sort === 'category') list.sort(byCat);
    if (state.sort === 'easy') list.sort((a, b) => a.diff - b.diff || byCat(a, b));
    if (state.sort === 'hard') list.sort((a, b) => b.diff - a.diff || byCat(a, b));
    return list;
  }

  function cardHTML(it) {
    const picked = state.picked.includes(it.id);
    const url = PROTOTYPES[it.id];
    return `
      <article class="card">
        ${url ? `<a class="card-img" href="${url}" aria-label="試玩「${esc(it.title)}」原型">` : '<div class="card-img">'}
          <span class="tag-cat">${esc(it.cat)}</span>
          ${url ? '' : '<span class="tag-proto plan">原型規劃中</span>'}
          ${THUMBS[it.id] ? `<img class="thumb" src="${THUMBS[it.id]}" alt="「${esc(it.title)}」原型畫面示意">` : `<span class="icon">${iconSvg(it.cat, 60)}</span>`}
        ${url ? '</a>' : '</div>'}
        <div class="card-body">
          <div class="meta">${it.platforms.map(p => `<span class="platform">${p}</span>`).join('')}</div>
          <h2>${url ? `<a href="${url}">${esc(it.title)}</a>` : esc(it.title)}</h2>
          <p class="summary">${esc(it.summary)}</p>
          <div class="features">
            <span class="label">功能特色</span>
            <ul>${it.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
          </div>
          <div class="benefit"><strong>效益｜</strong>${esc(it.benefit)}</div>
          <div class="card-foot">
            <span class="rating" aria-label="開發難易度 ${it.diff} / 5">
              <span class="label">難易度</span><span class="stars" aria-hidden="true">${starsText(it.diff)}</span>
            </span>
            <button class="pick" type="button" data-pick="${it.id}" aria-pressed="${picked}" aria-label="${picked ? `已投入 ${state.tokens[it.id]} 代幣，點選可修改` : '加入評估並投入代幣'}">${picked ? `✓ 已投 <span class="tk">${fmtN(state.tokens[it.id])}</span>` : '＋ 加入評估'}</button>
          </div>
        </div>
      </article>`;
  }

  function render() {
    syncControls();
    const list = filtered();
    $('count').textContent = list.length;
    $('pop-count').textContent = list.length;
    $('empty').hidden = list.length !== 0;
    $('grid').innerHTML = list.map(cardHTML).join('');
    renderDrawer();
  }

  /* ---------- 評估清單抽屜 ---------- */
  function renderDrawer() {
    const items = state.picked.map(id => byId[id]).filter(Boolean);
    const used = usedTokens(), left = TOKEN_TOTAL - used;
    $('picked-count').textContent = items.length;
    $('drawer-count').textContent = items.length;
    $('token-left').textContent = fmtN(left);
    $('token-chip').classList.toggle('is-zero', left === 0);
    $('drawer-body').innerHTML = items.length
      ? items.map(it => { const t = state.tokens[it.id] || 0, max = t + left; return `
        <div class="drawer-item">
          <span class="thumb">${iconSvg(it.cat, 26)}</span>
          <div class="info">
            ${PROTOTYPES[it.id] ? `<a href="${PROTOTYPES[it.id]}">${esc(it.title)}</a>` : `<span class="name">${esc(it.title)}</span>`}
            <span class="stars" aria-label="開發難易度 ${it.diff} / 5">${starsText(it.diff)}</span>
            <div class="tk-edit">
              <button type="button" data-tk-step="-1" data-id="${it.id}" aria-label="減少「${esc(it.title)}」代幣" ${t <= TOKEN_STEP ? 'disabled' : ''}>−</button>
              <input type="number" inputmode="numeric" min="1" max="${max}" step="${TOKEN_STEP}" value="${t}" data-tk-input="${it.id}" aria-label="「${esc(it.title)}」投入代幣">
              <button type="button" data-tk-step="1" data-id="${it.id}" aria-label="增加「${esc(it.title)}」代幣" ${left <= 0 ? 'disabled' : ''}>＋</button>
              <span>代幣</span>
            </div>
          </div>
          <button class="icon-btn" type="button" data-unpick="${it.id}" aria-label="從評估清單移除「${esc(it.title)}」">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>`; }).join('')
      : '<div class="drawer-empty">評估清單是空的。<br>在功能卡片按「加入評估」，輸入要投入的代幣。</div>';
    $('drawer-foot').hidden = items.length === 0;
    $('tk-used').textContent = `${fmtN(used)} / ${fmtN(TOKEN_TOTAL)}`;
    $('tk-bar').style.width = (used / TOKEN_TOTAL * 100) + '%';
    $('tk-bar-wrap').setAttribute('aria-valuenow', used);
    const hint = $('tk-hint');
    hint.classList.toggle('ok', left === 0);
    hint.textContent = left === 0 ? '代幣已全部分配，可以送出清單了！' : `還有 ${fmtN(left)} 代幣未分配，全部分配完才能送出清單。`;
    $('submit-picked').disabled = !(items.length && left === 0);
  }

  function setTokens(id, v) {
    const others = usedTokens() - (state.tokens[id] || 0);
    const n = Math.max(1, Math.min(TOKEN_TOTAL - others, Math.floor(Number(v) || 0)));
    state.tokens[id] = n; savePicked();
    return n;
  }
  function removePick(id) {
    state.picked = state.picked.filter(x => x !== id); delete state.tokens[id]; savePicked();
  }

  /* ---------- 對話框：歡迎訊息、投入代幣 ---------- */
  let modalReturn = null;
  function openModal(html, focusSel) {
    modalReturn = document.activeElement;
    $('modal-root').innerHTML = `<div class="modal-wrap" id="modal-wrap">${html}</div>`;
    const f = $('modal-root').querySelector(focusSel || 'button'); if (f) f.focus();
  }
  function closeModal() {
    $('modal-root').innerHTML = '';
    if (modalReturn && document.body.contains(modalReturn)) modalReturn.focus();
  }

  function showWelcome() {
    const left = leftTokens();
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
      <span class="coin-big">${COIN_SVG.replace('width="18" height="18"', 'width="34" height="34"')}</span>
      <h2 id="welcome-title" style="text-align:center">${left === TOKEN_TOTAL ? '歡迎！您目前手上有' : '歡迎回來！您目前還剩'}</h2>
      <div class="welcome-amt">${fmtN(left)} <small>代幣</small></div>
      <ul class="rules">
        <li>按功能卡片的「加入評估」，輸入要投給該點子的代幣。</li>
        <li>可在「評估清單」隨時調整每個點子的代幣。</li>
        <li>${fmtN(TOKEN_TOTAL)} 代幣全部分配完，才能送出清單。</li>
      </ul>
      <div class="modal-actions"><button class="btn-primary" type="button" data-modal="close">開始選擇</button></div>
    </div>`);
  }

  function openTokenModal(id) {
    const it = byId[id], cur = state.tokens[id] || 0, picked = state.picked.includes(id);
    const max = cur + leftTokens();
    if (max <= 0) {
      openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="tk-title">
        <h2 id="tk-title">代幣已全部分配</h2>
        <p>要投給「${esc(it.title)}」，請先到評估清單調低其他點子的代幣。</p>
        <div class="modal-actions"><button class="btn-primary" type="button" data-modal="open-drawer">打開評估清單</button>
          <button class="link-cancel" type="button" data-modal="close">取消</button></div></div>`);
      return;
    }
    const start = picked ? cur : Math.min(max, 100);
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="tk-title">
      <h2 id="tk-title">${picked ? '修改投入代幣' : '要投入多少代幣？'}</h2>
      <p>${esc(it.title)}</p>
      <div class="tk-input">
        <button class="tk-step" type="button" data-modal="dec" aria-label="減少 ${TOKEN_STEP} 代幣">−</button>
        <input type="number" inputmode="numeric" id="tk-val" min="1" max="${max}" step="${TOKEN_STEP}" value="${start}" aria-label="投入代幣數量">
        <button class="tk-step" type="button" data-modal="inc" aria-label="增加 ${TOKEN_STEP} 代幣">＋</button>
      </div>
      <div class="tk-quick" role="group" aria-label="快速選擇">
        ${[100, 200, 300].map(v => `<button type="button" data-modal-set="${v}" ${v > max ? 'disabled' : ''}>${v}</button>`).join('')}
        <button type="button" data-modal-set="${max}">全部 ${fmtN(max)}</button>
      </div>
      <div class="tk-note"><span>可投入上限</span><strong>${fmtN(max)} 代幣</strong></div>
      <div class="tk-note"><span>投入後剩餘</span><strong id="tk-after">${fmtN(max - start)} 代幣</strong></div>
      <span class="tk-err" id="tk-err" hidden></span>
      <div class="modal-actions">
        <button class="btn-primary" type="button" id="tk-ok" data-modal="confirm" data-id="${id}">${picked ? '確認修改' : '加入評估清單'}</button>
        ${picked ? `<button class="link-del" type="button" data-modal="remove" data-id="${id}">從評估清單移除</button>` : ''}
        <button class="link-cancel" type="button" data-modal="close">取消</button>
      </div>
    </div>`, '#tk-val');
    const inp = $('tk-val'); inp.select();
    const check = () => {
      const v = Math.floor(Number(inp.value)), ok = v >= 1 && v <= max;
      $('tk-err').hidden = ok || inp.value === '';
      $('tk-err').textContent = v > max ? `最多只能投入 ${fmtN(max)} 代幣` : '請輸入 1 以上的整數';
      $('tk-ok').disabled = !ok;
      $('tk-after').textContent = fmtN(Math.max(0, max - (ok ? v : 0))) + ' 代幣';
    };
    inp.addEventListener('input', check);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !$('tk-ok').disabled) $('tk-ok').click(); });
    check();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-modal], [data-modal-set]'); if (!b) { if (e.target.id === 'modal-wrap') closeModal(); return; }
    const inp = $('tk-val');
    if (b.dataset.modalSet) { inp.value = b.dataset.modalSet; inp.dispatchEvent(new Event('input')); return; }
    const act = b.dataset.modal;
    if (act === 'close') closeModal();
    else if (act === 'inc' || act === 'dec') {
      const max = Number(inp.max), v = Math.floor(Number(inp.value) || 0) + (act === 'inc' ? TOKEN_STEP : -TOKEN_STEP);
      inp.value = Math.max(1, Math.min(max, v)); inp.dispatchEvent(new Event('input'));
    }
    else if (act === 'confirm') {
      const id = b.dataset.id, isNew = !state.picked.includes(id);
      if (isNew) { state.picked.push(id); state.tokens[id] = 0; }
      const n = setTokens(id, inp.value);
      closeModal(); render();
      showToast(`${isNew ? '已加入評估清單' : '已更新'}，投入 ${fmtN(n)} 代幣・剩餘 ${fmtN(leftTokens())}`);
    }
    else if (act === 'remove') { removePick(b.dataset.id); closeModal(); render(); showToast('已從評估清單移除，代幣已退回'); }
    else if (act === 'open-drawer') { closeModal(); openDrawer(); }
  });

  // 抽屜內調整代幣
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-tk-step]'); if (!b) return;
    const id = b.dataset.id;
    setTokens(id, (state.tokens[id] || 0) + Number(b.dataset.tkStep) * TOKEN_STEP);
    render();
    const nb = document.querySelector(`[data-tk-step="${b.dataset.tkStep}"][data-id="${id}"]`);
    if (nb && !nb.disabled) nb.focus(); else { const inp = document.querySelector(`[data-tk-input="${id}"]`); if (inp) inp.focus(); }
  });
  document.addEventListener('change', e => {
    const id = e.target.dataset && e.target.dataset.tkInput; if (!id) return;
    const n = setTokens(id, e.target.value);
    render();
    const inp = document.querySelector(`[data-tk-input="${id}"]`); if (inp) inp.focus();
    if (Number(e.target.value) !== n) showToast(`已調整為 ${fmtN(n)} 代幣（不可超過剩餘額度）`);
  });

  let lastFocus = null;
  function openDrawer() {
    lastFocus = document.activeElement;
    $('drawer').classList.add('open'); $('scrim').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    document.body.classList.add('drawer-open');
    $('close-drawer').focus();
  }
  function closeDrawer() {
    $('drawer').classList.remove('open'); $('scrim').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('drawer-open');
    if (lastFocus) lastFocus.focus();
  }

  function showToast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.cat) {
      state.cats = d.cat === '__all' ? [] : [d.cat];
    }
    else if (d.platform) state.platforms = state.platforms.includes(d.platform) ? state.platforms.filter(x => x !== d.platform) : state.platforms.concat(d.platform);
    else if (d.pick) { openTokenModal(d.pick); return; }
    else if (d.unpick) { removePick(d.unpick); showToast('已移除，代幣已退回'); }
    else if (d.sortopt) { state.sort = d.sortopt; }
    else if (d.clear === 'all') { state.cats = []; state.diffMin = state.diffMax = 0; state.platforms = []; state.sort = 'category'; state.q = ''; }
    else if (d.clear === 'filters') { state.diffMin = state.diffMax = 0; state.platforms = []; state.sort = 'category'; }
    else if (d.clear === 'sort') { state.sort = 'category'; }
    else if (d.clear === 'diff') { state.diffMin = state.diffMax = 0; }
    else if (d.rmplat) { state.platforms = state.platforms.filter(x => x !== d.rmplat); }
    else if (b.id === 'search-chip') { state.q = ''; }
    else return;
    render();
  });

  /* ---------- 篩選浮層 ---------- */
  const mqSheet = window.matchMedia('(max-width: 720px)');
  function setFilterPop(open, focusBack) {
    $('filter-pop').hidden = !open;
    $('filter-btn').setAttribute('aria-expanded', String(open));
    $('filter-scrim').hidden = !(open && mqSheet.matches);
    $('list-top').classList.toggle('pop-open', open);
    if (open) { const f = $('filter-pop').querySelector('.star-btn'); if (f) f.focus(); }
    else if (focusBack) $('filter-btn').focus();
  }
  $('filter-btn').addEventListener('click', () => setFilterPop($('filter-pop').hidden));
  $('filter-done').addEventListener('click', () => setFilterPop(false, true));
  $('filter-close').addEventListener('click', () => setFilterPop(false, true));
  $('filter-scrim').addEventListener('click', () => setFilterPop(false, true));
  document.addEventListener('click', e => { if (!$('filter-pop').hidden && !e.target.closest('.filter-wrap') && !e.target.closest('#filter-scrim')) setFilterPop(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('filter-pop').hidden) { e.stopImmediatePropagation(); setFilterPop(false, true); } }, true);
  // 工具列吸頂位置跟著頁首高度
  (function syncHeaderHeight() {
    const h = document.querySelector('header');
    const set = () => document.documentElement.style.setProperty('--hdr-h', h.offsetHeight + 'px');
    set(); if ('ResizeObserver' in window) new ResizeObserver(set).observe(h); else window.addEventListener('resize', set);
  })();

  $('open-drawer').addEventListener('click', openDrawer);
  $('close-drawer').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('modal-root').innerHTML) { closeModal(); return; }
    if ($('drawer').classList.contains('open')) closeDrawer();
  });

  $('clear-picked').addEventListener('click', () => {
    if (!state.picked.length) return;
    if (!confirm('確定要清空評估清單嗎？')) return;
    state.picked = []; state.tokens = {}; savePicked(); render();
  });
  /* ---------- 送出購買 → 結帳完成頁 ---------- */
  let lastOrder = null;
  $('submit-picked').addEventListener('click', () => {
    const items = state.picked.map(id => ({ ...byId[id], tokens: state.tokens[id] })).filter(it => it.id).sort((a, b) => b.tokens - a.tokens);
    if (!items.length || leftTokens() !== 0) return;
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    lastOrder = {
      no: 'FX' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '-' + String(Math.floor(Math.random() * 9000) + 1000),
      time: `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
      items
    };
    state.picked = []; state.tokens = {}; savePicked();
    closeDrawer();
    render();
    showCheckout();
  });

  /* ---------- 以 Email 寄出方案 ---------- */
  const VOTE_EMAIL = 'saya6084@gmail.com';
  function planText(o) {
    const lines = ['外匯體驗點子商城｜點子評估方案', '', `方案編號：${o.no}`, `送出時間：${o.time}`, '', '方案內容（依投入代幣排序）：'];
    o.items.forEach((it, i) => lines.push(`${i + 1}. 【${it.cat}】${it.title}：${it.tokens} 代幣`));
    lines.push('', `合計：${o.items.reduce((s, it) => s + it.tokens, 0)} 代幣`, '', '統計代碼（請勿修改）：', 'FXVOTE|' + o.no + '|' + o.items.map(it => it.id + '=' + it.tokens).join(';'));
    return lines.join('\n');
  }
  function mailtoHref(o) {
    return 'mailto:' + VOTE_EMAIL + '?subject=' + encodeURIComponent('【點子商城投票】方案 ' + o.no) + '&body=' + encodeURIComponent(planText(o));
  }
  document.addEventListener('click', async e => {
    if (e.target.closest('#send-mail')) { $('send-status').textContent = '已開啟郵件軟體，寄出後即完成。若沒有出現，請改用「複製方案內容」。'; return; }
    if (!e.target.closest('#copy-plan')) return;
    const text = $('plan-text').value;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (err) {}
    if (!ok) { const d = e.target.closest('.co-send').querySelector('details'); d.open = true; const t = $('plan-text'); t.focus(); t.select(); try { ok = document.execCommand('copy'); } catch (err) {} }
    $('send-status').textContent = ok ? `已複製，請貼到 Email 寄給 ${VOTE_EMAIL}。` : '無法自動複製，內容已選取，請按 Ctrl+C（Mac 為 ⌘+C）複製。';
  });

  function showCheckout() {
    const o = lastOrder, items = o.items;
    const avg = items.reduce((s, it) => s + it.diff, 0) / items.length;
    const plats = PLATFORMS.filter(p => items.some(it => it.platforms.includes(p)));
    const withProto = items.filter(it => PROTOTYPES[it.id]).length;
    $('checkout').innerHTML = `
      <div class="co-hero">
        <span class="co-check"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        <h1 id="co-title" tabindex="-1">您的點子方案已完成</h1>
        <p>共 ${items.length} 項功能點子。請用下方按鈕寄出方案，才會計入投票統計。</p>
        <div class="co-meta"><span>方案編號 <strong>${o.no}</strong></span><span>送出時間 <strong>${o.time}</strong></span></div>
      </div>
      <div class="co-stats">
        <div class="co-stat"><span>點子數量</span><strong>${items.length} 項</strong></div>
        <div class="co-stat"><span>平均開發難易度</span><strong>${avg.toFixed(1)} 星</strong></div>
        <div class="co-stat"><span>投入代幣</span><strong>${fmtN(TOKEN_TOTAL)}</strong></div>
        <div class="co-stat"><span>可試玩原型</span><strong>${withProto} / ${items.length}</strong></div>
      </div>
      <div class="co-list-head"><h2>方案內容</h2><span>依投入代幣排序</span></div>
      <ol class="co-list">${items.map((it, i) => `
        <li class="co-item">
          <span class="co-no">${i + 1}</span>
          <span class="co-thumb">${THUMBS[it.id] ? `<img src="${THUMBS[it.id]}" alt="">` : iconSvg(it.cat, 40)}</span>
          <div class="co-body">
            <div class="meta"><span class="tag-cat" style="position:static">${esc(it.cat)}</span>${it.platforms.map(p => `<span class="platform">${p}</span>`).join('')}</div>
            <h3>${esc(it.title)}</h3>
            <p>${esc(it.summary)}</p>
            <div class="benefit"><strong>效益｜</strong>${esc(it.benefit)}</div>
          </div>
          <div class="co-side">
            <span class="co-tokens"><b>${fmtN(it.tokens)}</b><span>代幣・占 ${Math.round(it.tokens / TOKEN_TOTAL * 100)}%</span></span>
            <span class="co-share" aria-hidden="true"><i style="width:${it.tokens / TOKEN_TOTAL * 100}%"></i></span>
            <span class="rating" aria-label="開發難易度 ${it.diff} / 5"><span class="label">難易度</span><span class="stars" aria-hidden="true">${starsText(it.diff)}</span></span>
          </div>
        </li>`).join('')}
      </ol>
      <section class="co-send" aria-labelledby="send-title">
        <h2 id="send-title">最後一步：寄出您的方案</h2>
        <p>按「用 Email 寄出」會開啟您的郵件軟體，收件人與內容都已填好，直接寄出即可。<br>若無法開啟郵件軟體，請按「複製方案內容」，貼到 Email 寄給 ${VOTE_EMAIL}。</p>
        <div class="send-btns">
          <a class="btn-primary" id="send-mail" href="${mailtoHref(o)}" target="_blank" rel="noopener">用 Email 寄出</a>
          <button class="btn-outline" type="button" id="copy-plan">複製方案內容</button>
        </div>
        <div class="send-status" id="send-status" role="status"></div>
        <details><summary>查看要寄出的內容</summary><textarea id="plan-text" readonly aria-label="方案內容">${esc(planText(o))}</textarea></details>
      </section>
      <div class="co-actions">
        <button class="btn-outline" type="button" data-action="back-list">返回功能列表</button>
      </div>`;
    $('toast').classList.remove('show');
    document.body.classList.add('on-checkout');
    $('list-top').hidden = true; $('list-main').hidden = true; $('checkout').hidden = false;
    window.scrollTo(0, 0);
    $('co-title').focus();
  }

  function backToList() {
    document.body.classList.remove('on-checkout');
    $('checkout').hidden = true; $('list-top').hidden = false; $('list-main').hidden = false;
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action="back-list"], .brand');
    if (!b) return;
    if (b.classList.contains('brand')) { if (!$('checkout').hidden) { e.preventDefault(); backToList(); } return; }
    backToList();
  });

  /* ---------- 記住篩選條件：從內頁返回時還原 ---------- */
  const VIEW_KEY = 'fx-idea-shop-view';
  let restoreY = 0;
  try {
    const v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || 'null');
    if (v) {
      restoreY = +v.y || 0;
      if (Array.isArray(v.cats)) state.cats = v.cats.filter(c => CATEGORIES.includes(c));
      if (Array.isArray(v.platforms)) state.platforms = v.platforms.filter(p => PLATFORMS.includes(p));
      if (SORTS.some(o => o.id === v.sort)) state.sort = v.sort;
      if (v.diffMax >= 1 && v.diffMax <= 5) { state.diffMin = 1; state.diffMax = v.diffMax; }
    }
  } catch (e) {}
  function saveView() {
    try { sessionStorage.setItem(VIEW_KEY, JSON.stringify({ cats: state.cats, platforms: state.platforms, sort: state.sort, diffMax: state.diffMin ? state.diffMax : 0, y: Math.round(window.scrollY) })); } catch (e) {}
  }
  const _render = render;
  render = function () { _render(); saveView(); };
  window.addEventListener('pagehide', saveView);
  document.addEventListener('click', e => { if (e.target.closest('#grid a[href]')) saveView(); }, true);

  buildControls();
  render();
  if (restoreY) requestAnimationFrame(() => { window.scrollTo(0, restoreY); saveView(); });
  // 代幣說明只在第一次進入時顯示；之後從原型頁返回首頁不再跳出
  const WELCOME_KEY = 'fx-idea-shop-welcomed';
  let welcomed = false;
  try { welcomed = localStorage.getItem(WELCOME_KEY) === '1'; } catch (e) {}
  if (!welcomed) {
    showWelcome();
    try { localStorage.setItem(WELCOME_KEY, '1'); } catch (e) {}
  }
</script>
</body>
</html>
