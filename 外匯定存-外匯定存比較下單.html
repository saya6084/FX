(function(){

    document.body.appendChild(g);

    });

  :root {

<main class="stage lv2-stage"><div class="handset lv2-device" aria-label="手機操作畫面"><div class="inner"><div class="app" id="app"></div></div></div><aside class="info lv2-info" aria-label="功能說明"><section class="info-card"><div class="tags"><span class="tag-cat">外匯定存</span><span class="platform">APP</span><span class="platform">網銀</span></div><h1>外匯定存比較下單</h1><div class="rating" aria-label="開發難易度 4 / 5"><span>開發難易度</span><span class="stars" aria-hidden="true"><span class="on">★★★★</span><span class="off">★</span></span></div><p>依資金可運用的期間篩選專案，以相同本金比較各方案收益與匯率風險，再將選定條件帶入下單。</p><details class="more"><summary>功能特色與效益</summary><div class="more-body"><div><ul class="features"><li>依天期上限篩選，勾選多個專案一起比較</li><li>共用本金即時試算，清楚呈現各天期收益</li><li>依換匯成本提示各方案的盈虧平衡匯率</li><li>選定方案後，自動帶入金額、天期與利率</li></ul></div><div class="benefit"><strong>效益｜</strong>從篩選、比較到承作，延續每一步的選擇，減少重複填寫。</div></div></details></section><section class="info-card flow lv2-flow"><h2>操作流程</h2><ol class="flow-list" id="flow-list"></ol><button class="reset" id="reset" type="button">重設</button><p class="note">專案條件參考官方公告資訊，試算結果僅為示意數字，實際承作條件與收益依銀行公告及交易時資訊為準。</p></section></aside></main><script>
const PROJECTS=[{id:'m1',months:1,name:'1 個月',rate:3.728},{id:'m3',months:3,name:'3 個月',rate:3.968},{id:'m6',months:6,name:'6 個月',rate:4.028},{id:'m12',months:12,name:'1 年',rate:4.128}];
const STEPS=[['list','專案總覽','篩選天期，勾選欲比較的專案'],['compare','收益試算','調整本金，比較收益與匯率條件'],['order','確認下單','帶入選定參數，確認送出']];
const fresh=()=>({page:'list',limit:'all',selected:[],principal:10000,fx:32,order:null});let S=fresh();
const app=document.getElementById('app');const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const chosen=()=>PROJECTS.filter(p=>S.selected.includes(p.id));const visible=()=>PROJECTS.filter(p=>S.limit==='all'||p.months<=Number(S.limit));
const valid=()=>Number.isFinite(S.principal)&&S.principal>=3000;
const validFx=()=>Number.isFinite(S.fx)&&S.fx>0;
const interest=p=>S.principal*p.rate/100*p.months/12;
const breakEven=p=>S.fx/(1+p.rate/100*p.months/12);
function header(title,back){return '<div class="top"><div class="head">'+(back?'<button type="button" class="nav" data-go="'+back+'" aria-label="上一步">‹</button>':'<span class="nav"></span>')+'<h2>'+title+'</h2><span class="nav"></span></div>'+(S.page==='success'?'':'<div class="stepstrip">'+STEPS.map((x,i)=>'<'+(S.page===x[0]?'b':'span')+'>'+(i+1)+' '+x[1]+'</'+(S.page===x[0]?'b':'span')+'>').join('')+'</div>')+'</div>'}
function actions(html){return '<div class="actions">'+html+'</div>'}function btn(text,attrs,cls='primary'){return '<button type="button" class="action '+cls+'" '+attrs+'>'+text+'</button>'}
function list(){return header('外匯定存比較下單')+'<div class="app-body"><div class="box fields"><div><label class="caption" for="currency">承作幣別</label><select id="currency"><option>美金 USD</option></select></div><div><label class="caption" for="tenor">天期篩選</label><select id="tenor">'+[['all','全部天期'],['3','3 個月內'],['6','6 個月內'],['12','1 年內']].map(x=>'<option value="'+x[0]+'" '+(S.limit===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div></div><div class="result-head"><span>符合條件 '+visible().length+' 項專案</span><b>已選 '+S.selected.length+' 項</b></div>'+visible().map(p=>'<label class="project"><span class="proj-top"><input type="checkbox" data-project="'+p.id+'" '+(S.selected.includes(p.id)?'checked':'')+'><span>美元定存・'+p.name+'期</span></span><div class="apr">'+p.rate.toFixed(3)+'% <small>固定年利率</small></div><div class="meta"><span>門檻 USD 3,000</span></div></label>').join('')+'<p class="hint">「內」包含該天期。切換篩選時，超出範圍的已選專案會取消勾選。</p></div>'+actions(btn('開始比較已選專案（'+S.selected.length+'）','data-go="compare" '+(!S.selected.length?'disabled':'')))}
function cards(){return chosen().map(p=>'<article class="box compare"><h3>'+p.name+'期</h3><div class="rate">固定年利率 '+p.rate.toFixed(3)+'%</div><strong class="interest">'+(valid()?'+'+money(interest(p)):'—')+'</strong><small>預估利息 USD</small><div class="total">到期本息 USD<br><b>'+(valid()?money(S.principal+interest(p)):'—')+'</b></div>'+btn('以此承作','data-order="'+p.id+'" '+(!valid()?'disabled':''),'outline')+'</article>').join('')}
function risks(){return chosen().map(p=>'<div class="risk-row"><span>'+p.name+'期</span><b>'+(validFx()?breakEven(p).toFixed(4):'—')+'</b></div>').join('')}
function compare(){return header('外匯定存比較下單','list')+'<div class="app-body"><div class="box"><label class="caption" for="principal">試算本金</label><div class="amount-field"><span>USD</span><input id="principal" type="number" min="3000" step="any" value="'+(Number.isFinite(S.principal)?S.principal:'')+'" aria-describedby="principal-error"></div><p id="principal-error" class="error" '+(valid()?'hidden':'')+'>請輸入至少 USD 3,000 的本金。</p><p class="hint">相同本金套用至所有已選方案</p></div><h3>預估到期收益</h3><p class="sub">各方案天期不同，以下為各自到期收益。</p><div class="compare-grid" id="cards">'+cards()+'</div><section class="risk"><h3>盈虧平衡匯率</h3><label for="fx">買入美元的換匯成本（TWD／USD）</label><input id="fx" type="number" min="0.0001" step="0.0001" value="'+(Number.isFinite(S.fx)?S.fx:'')+'" aria-describedby="fx-error"><p class="error" id="fx-error" '+(validFx()?'hidden':'')+'>請輸入大於 0 的換匯成本。</p><p>若以新臺幣換匯承作，到期銀行買入美元的匯率需達以下數值，換回新臺幣才可收回原始本金。</p><div id="risks">'+risks()+'</div><p class="hint">以換匯成本 ÷（1 ＋ 年利率 × 月數 ÷ 12）估算，未計稅費與其他成本。已有美元者可僅參考利息收益。</p></section><p class="hint">利息為稅前簡化試算；實際計息依銀行承作條件為準。</p></div>'+actions(btn('返回調整專案','data-go="list"',''))}
function summary(p){return '<dl class="summary">'+[['承作幣別','美金 USD'],['承作金額','USD '+money(S.principal)],['承作天期',p.name],['固定年利率',p.rate.toFixed(3)+'%'],['預估利息','USD '+money(interest(p))],['到期本息','USD '+money(S.principal+interest(p))]].map(x=>'<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>').join('')+'</dl>'}
function order(){const p=PROJECTS.find(p=>p.id===S.order);return header('外匯定存比較下單','compare')+'<div class="app-body"><h3>轉存外匯定存</h3><p class="sub">已帶入您選定的方案與試算本金，請確認承作條件。</p><div class="box">'+summary(p)+'</div><p class="hint">預估利息未扣稅費。</p></div>'+actions(btn('返回修改','data-go="compare"','')+btn('確認送出','data-submit'))}
function success(){const p=PROJECTS.find(p=>p.id===S.order);return header('外匯定存比較下單')+'<div class="app-body"><div class="success" role="status"><div class="check">✓</div><h3>交易完成</h3></div><div class="box">'+summary(p)+'</div></div>'+actions(btn('重新試算','data-reset'))}
function render(){app.innerHTML=({list,compare,order,success}[S.page])();document.getElementById('flow-list').innerHTML=STEPS.map((x,i)=>'<li><button type="button" class="flow-btn" data-jump="'+x[0]+'" '+((S.page===x[0]||(S.page==='success'&&x[0]==='order'))?'aria-current="step"':'')+'><span class="no">'+(i+1)+'</span><span><strong>'+x[1]+'</strong>'+x[2]+'</span></button></li>').join('')}
function navigate(page){if(page==='compare'&&!S.selected.length){alert('請先勾選欲比較的專案。');return}if(page==='order'&&(!S.order||!valid())){alert('請先在比較頁選擇「以此承作」。');return}S.page=page;render()}
document.addEventListener('change',e=>{if(e.target.id==='tenor'){S.limit=e.target.value;const ids=visible().map(p=>p.id);S.selected=S.selected.filter(id=>ids.includes(id));S.order=null;render()}if(e.target.matches('[data-project]')){const id=e.target.dataset.project;S.selected=e.target.checked?[...S.selected,id]:S.selected.filter(x=>x!==id);S.order=null;const top=app.querySelector('.app-body').scrollTop;render();app.querySelector('.app-body').scrollTop=top}});
document.addEventListener('input',e=>{if(e.target.id==='principal'){S.principal=e.target.valueAsNumber;S.order=null;document.getElementById('cards').innerHTML=cards();document.getElementById('principal-error').hidden=valid()}if(e.target.id==='fx'){S.fx=e.target.valueAsNumber;document.getElementById('risks').innerHTML=risks();document.getElementById('fx-error').hidden=validFx()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go)navigate(b.dataset.go);if(b.dataset.jump)navigate(b.dataset.jump);if(b.dataset.order&&valid()&&S.selected.includes(b.dataset.order)){S.order=b.dataset.order;navigate('order')}if(b.hasAttribute('data-submit')&&S.order&&valid()){S.page='success';render()}if(b.id==='reset'||b.hasAttribute('data-reset')){S=fresh();render()}});
render();
</script><script id="inner-nav" data-idea="fd-item-2" data-title="外匯定存比較下單">
(function(){
  var me=document.currentScript, ID=me.dataset.idea, TITLE=me.dataset.title;
  var KEY='fx-idea-shop-tokens-v2', TOTAL=1000, STEP=50;
  var BAG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){return Number(n).toLocaleString('en-US');}
  function load(){
    try{ var v=JSON.parse(localStorage.getItem(KEY));
      if(v&&Array.isArray(v.picked)&&v.tokens){ var p=v.picked.filter(function(id){return v.tokens[id]>0;}), t={}; p.forEach(function(id){t[id]=Math.floor(v.tokens[id]);});
        if(p.reduce(function(s,id){return s+t[id];},0)<=TOTAL) return {picked:p,tokens:t}; } }catch(e){}
    return {picked:[],tokens:{}};
  }
  function save(st){ try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){} }
  function used(st){ return st.picked.reduce(function(s,id){return s+(st.tokens[id]||0);},0); }
  var box, ret=null;
  function render(){
    box=document.getElementById('nav-actions'); if(!box) return;
    var st=load(), on=st.picked.indexOf(ID)>=0, n=st.picked.length;
    box.innerHTML='<button type="button" class="nv-add'+(on?' on':'')+'" id="nv-add">'+(on?'✓ 已加入評估':'＋ 加入評估')+'</button>'+
      (n?'<a class="nv-cart" href="index.html#list" aria-label="評估清單，共 '+n+' 項">'+BAG+'<span class="t">評估清單</span><span class="b">'+n+'</span></a>':'');
    document.getElementById('nv-add').addEventListener('click',openModal);
  }
  function close(){ var w=document.getElementById('nv-wrap'); if(w) w.remove(); document.removeEventListener('keydown',onKey,true); if(ret&&document.body.contains(ret)) ret.focus(); }
  function onKey(e){ if(e.key==='Escape'){ e.stopPropagation(); close(); } }
  function toast(msg){ var t=document.getElementById('nv-toast'); if(!t){t=document.createElement('div');t.id='nv-toast';t.className='nv-toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }
  function openModal(){
    ret=document.activeElement;
    var st=load(), on=st.picked.indexOf(ID)>=0, cur=st.tokens[ID]||0, max=cur+(TOTAL-used(st));
    var w=document.createElement('div'); w.className='nv-wrap'; w.id='nv-wrap';
    if(max<=0){
      w.innerHTML='<div class="nv-modal" role="dialog" aria-modal="true" aria-labelledby="nv-title"><h2 id="nv-title">代幣已全部分配</h2><p>要投給「'+esc(TITLE)+'」，請先到評估清單調低其他點子的代幣。</p><div class="nv-actions"><a class="nv-ok" href="index.html#list">打開評估清單</a><button class="nv-link" type="button" data-x="close">取消</button></div></div>';
    } else {
      var start=on?cur:Math.min(max,100);
      w.innerHTML='<div class="nv-modal" role="dialog" aria-modal="true" aria-labelledby="nv-title"><h2 id="nv-title">'+(on?'修改投入代幣':'要投入多少代幣？')+'</h2><p>'+esc(TITLE)+'</p>'+
        '<div class="nv-step"><button type="button" data-x="dec" aria-label="減少 '+STEP+' 代幣">−</button><input type="number" inputmode="numeric" id="nv-val" min="1" max="'+max+'" step="'+STEP+'" value="'+start+'" aria-label="投入代幣數量"><button type="button" data-x="inc" aria-label="增加 '+STEP+' 代幣">＋</button></div>'+
        '<div class="nv-quick" role="group" aria-label="快速選擇">'+[100,200,300].map(function(v){return '<button type="button" data-set="'+v+'"'+(v>max?' disabled':'')+'>'+v+'</button>';}).join('')+'<button type="button" data-set="'+max+'">全部 '+fmt(max)+'</button></div>'+
        '<div class="nv-note"><span>可投入上限</span><strong>'+fmt(max)+' 代幣</strong></div><div class="nv-note"><span>投入後剩餘</span><strong id="nv-after"></strong></div><div class="nv-err" id="nv-err"></div>'+
        '<div class="nv-actions"><button class="nv-ok" type="button" id="nv-ok">'+(on?'確認修改':'加入評估清單')+'</button>'+(on?'<button class="nv-link del" type="button" data-x="remove">從評估清單移除</button>':'')+'<button class="nv-link" type="button" data-x="close">取消</button></div></div>';
    }
    document.body.appendChild(w); document.addEventListener('keydown',onKey,true);
    w.addEventListener('click',function(e){ if(e.target===w){close();return;} var b=e.target.closest('[data-x],[data-set]'); if(!b) return; var inp=document.getElementById('nv-val');
      if(b.dataset.set){ inp.value=b.dataset.set; check(); return; }
      var x=b.dataset.x;
      if(x==='close') close();
      else if(x==='inc'||x==='dec'){ var v=Math.floor(Number(inp.value)||0)+(x==='inc'?STEP:-STEP); inp.value=Math.max(1,Math.min(max,v)); check(); }
      else if(x==='remove'){ var s=load(); s.picked=s.picked.filter(function(i){return i!==ID;}); delete s.tokens[ID]; save(s); close(); render(); toast('已從評估清單移除，代幣已退回'); }
    });
    var inp=document.getElementById('nv-val');
    function check(){ var v=Math.floor(Number(inp.value)), ok=v>=1&&v<=max; document.getElementById('nv-err').textContent=ok||inp.value===''?'':(v>max?'最多只能投入 '+fmt(max)+' 代幣':'請輸入 1 以上的整數'); document.getElementById('nv-ok').disabled=!ok; document.getElementById('nv-after').textContent=fmt(Math.max(0,max-(ok?v:0)))+' 代幣'; }
    if(inp){ inp.addEventListener('input',check); inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!document.getElementById('nv-ok').disabled) document.getElementById('nv-ok').click(); }); check();
      document.getElementById('nv-ok').addEventListener('click',function(){ var s=load(), isNew=s.picked.indexOf(ID)<0, others=used(s)-(s.tokens[ID]||0); var n=Math.max(1,Math.min(TOTAL-others,Math.floor(Number(inp.value)||0))); if(isNew) s.picked.push(ID); s.tokens[ID]=n; save(s); close(); render(); toast((isNew?'已加入評估清單':'已更新')+'，投入 '+fmt(n)+' 代幣・剩餘 '+fmt(TOTAL-used(s))); });
      inp.focus(); inp.select(); }
    else { var f=w.querySelector('.nv-ok'); if(f) f.focus(); }
  }
  window.addEventListener('storage',function(e){ if(e.key===KEY) render(); });
  window.addEventListener('pageshow',render);
  if(document.readyState!=='loading') render(); else document.addEventListener('DOMContentLoaded',render);
})();
</script>
<script id="layout-v3-js">
(function(){
  var MIN_SCALE=0.75;
  function sync(){
    var tb=document.querySelector('.bot-topbar, body > .topbar');
    var h=tb?tb.offsetHeight:69; document.documentElement.style.setProperty('--tb-h',h+'px');
    var wide=window.matchMedia('(min-width: 961px)').matches;
    var dev=document.querySelector('.lv2-device');
    if(dev){
      var nozoom=dev.hasAttribute('data-lv2-nozoom');
      dev.style.zoom=''; dev.style.top=''; dev.classList.remove('lv2-sticky');
      if(wide){
        var avail=window.innerHeight-h-48, natural=dev.offsetHeight;
        if(nozoom){ if(natural<=avail+1) dev.classList.add('lv2-sticky'); }
        else { var s=Math.min(1, avail/natural);
          if(s>=MIN_SCALE){ if(s<1) dev.style.zoom=s.toFixed(4); dev.classList.add('lv2-sticky'); dev.style.top=((h+24)/s).toFixed(2)+'px'; } }
      }
    }
    var info=document.querySelector('.lv2-info'), flow=document.querySelector('.lv2-flow');
    if(!info||!flow) return;
    info.style.paddingBottom='';
    if(!wide) return;
    var flowTop=flow.getBoundingClientRect().top+window.scrollY;
    var need=flowTop-(h+24)+window.innerHeight, pad=0;
    for(var i=0;i<3;i++){ var d=need-document.documentElement.scrollHeight; if(d<=0) break; pad+=d; info.style.paddingBottom=pad+'px'; }
  }
  var raf=0; function later(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(sync); }
  window.addEventListener('resize', later);
  window.addEventListener('load', later);
  document.addEventListener('toggle', later, true);
  function init(){ sync(); var f=document.querySelector('.lv2-flow'); if(f&&window.ResizeObserver) new ResizeObserver(later).observe(f); }
  if (document.readyState !== 'loading') init(); else document.addEventListener('DOMContentLoaded', init);
})();
</script>
