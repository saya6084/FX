  :root {

.info h1{ margin: 0; font-size: 28px; font-weight: 900; line-height: 1.35; }

.info .rating{ display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

.info .features{ margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.info .features li{ font-size: 14px; color: var(--text); line-height: 1.6; display: flex; gap: 8px; }
.info .features li::before{ content: "✓"; color: var(--faint); font-weight: 900; }
.info .benefit{ font-size: 14px; line-height: 1.6; color: var(--gold-text); background: var(--gold-bg); border: 1px solid var(--gold-line); border-radius: 12px; padding: 10px 12px; }
.info .benefit strong{ color: var(--gold-strong); }
.info .flow h2{ margin: 0; font-size: 17px; font-weight: 900; }
.info .flow-list{ margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.info .flow-btn{ width: 100%; min-height: 52px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; color: var(--text); font-size: 14px; }
.info .flow-btn:hover{ border-color: var(--ink); }
.info .flow-btn .no{ width: 28px; height: 28px; flex: none; border-radius: 50%; background: #f1f5f9; color: var(--muted); font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.info .flow-btn strong{ display: block; color: var(--ink); font-size: 15px; }
.info .flow-btn[aria-current="step"]{ border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.info .flow-btn[aria-current="step"] .no{ background: var(--accent); color: #fff; }
.info .note{ font-size: 12px; color: var(--faint); line-height: 1.7; margin: 0; }
.info .reset{ align-self: flex-start; min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; }
.info .reset:hover{ border-color: var(--ink); }
.info .note{font-size:12px;color:var(--faint);line-height:1.7;margin:0}
.topbar{font-family:'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', 'Heiti TC',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
</style></head><body>
<div class="topbar">

</div>
<main class="stage"><div class="handset" aria-label="手機操作畫面"><div class="inner"><div class="app" id="app"></div></div></div><aside class="info" aria-label="功能說明"><section class="info-card"><div class="tags"><span class="tag-cat">外匯定存</span><span class="platform">APP</span><span class="platform">網銀</span></div><h1>外匯定存比較下單</h1><div class="rating" aria-label="開發難易度 4 / 5"><span>開發難易度</span><span class="stars" aria-hidden="true"><span class="on">★★★★</span><span class="off">★</span></span></div><p>依資金可運用的期間篩選專案，以相同本金比較各方案收益與匯率風險，再將選定條件帶入下單。</p><div><div class="label">功能特色</div><ul class="features"><li>依天期上限篩選，勾選多個專案一起比較</li><li>共用本金即時試算，清楚呈現各天期收益</li><li>依換匯成本提示各方案的盈虧平衡匯率</li><li>選定方案後，自動帶入金額、天期與利率</li></ul></div><div class="benefit"><strong>效益｜</strong>從篩選、比較到承作，延續每一步的選擇，減少重複填寫。</div></section><section class="info-card flow"><h2>操作流程</h2><ol class="flow-list" id="flow-list"></ol><button class="reset" id="reset" type="button">重設</button><p class="note">專案條件參考官方公告資訊，試算結果僅為示意數字，實際承作條件與收益依銀行公告及交易時資訊為準。</p></section></aside></main><script>
const PROJECTS=[{id:'m1',months:1,name:'1 個月',rate:3.728},{id:'m3',months:3,name:'3 個月',rate:3.968},{id:'m6',months:6,name:'6 個月',rate:4.028},{id:'m12',months:12,name:'1 年',rate:4.128}];
const STEPS=[['list','專案總覽','篩選天期，勾選欲比較的專案'],['compare','收益試算','調整本金，比較收益與匯率條件'],['order','確認下單','帶入選定參數，確認送出']];
const fresh=()=>({page:'list',limit:'all',selected:[],principal:10000,fx:32,order:null});let S=fresh();
const app=document.getElementById('app');const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const chosen=()=>PROJECTS.filter(p=>S.selected.includes(p.id));const visible=()=>PROJECTS.filter(p=>S.limit==='all'||p.months<=Number(S.limit));
const valid=()=>Number.isFinite(S.principal)&&S.principal>=3000;
const validFx=()=>Number.isFinite(S.fx)&&S.fx>0;
const interest=p=>S.principal*p.rate/100*p.months/12;
const breakEven=p=>S.fx/(1+p.rate/100*p.months/12);
function header(title,back){return '<div class="top"><div class="head">'+(back?'<button type="button" class="nav" data-go="'+back+'" aria-label="上一步">‹</button>':'<span class="nav"></span>')+'<h2>'+title+'</h2><span class="nav"></span></div>'+(S.page==='success'?'':'<div class="stepstrip">'+STEPS.map((x,i)=>'<'+(S.page===x[0]?'b':'span')+'>'+(i+1)+' '+x[1]+'</'+(S.page===x[0]?'b':'span')+'>').join('')+'</div>')+'</div>'}
function actions(html){return '<div class="actions">'+html+'</div>'}function btn(text,attrs,cls='primary'){return '<button type="button" class="action '+cls+'" '+attrs+'>'+text+'</button>'}
function list(){return header('外匯定存比較下單')+'<div class="app-body"><div class="box fields"><div><label class="caption" for="currency">承作幣別</label><select id="currency"><option>美金 USD</option></select></div><div><label class="caption" for="tenor">天期篩選</label><select id="tenor">'+[['all','全部天期'],['3','3 個月內'],['6','6 個月內'],['12','1 年內']].map(x=>'<option value="'+x[0]+'" '+(S.limit===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div></div><div class="result-head"><span>符合條件 '+visible().length+' 項專案</span><b>已選 '+S.selected.length+' 項</b></div>'+visible().map(p=>'<label class="project"><span class="proj-top"><input type="checkbox" data-project="'+p.id+'" '+(S.selected.includes(p.id)?'checked':'')+'><span>美元定存・'+p.name+'期</span></span><div class="apr">'+p.rate.toFixed(3)+'% <small>固定年利率</small></div><div class="meta"><span>門檻 USD 3,000</span></div></label>').join('')+'<p class="hint">「內」包含該天期。切換篩選時，超出範圍的已選專案會取消勾選。</p></div>'+actions(btn('開始比較已選專案（'+S.selected.length+'）','data-go="compare" '+(!S.selected.length?'disabled':'')))}
function cards(){return chosen().map(p=>'<article class="box compare"><h3>'+p.name+'期</h3><div class="rate">固定年利率 '+p.rate.toFixed(3)+'%</div><strong class="interest">'+(valid()?'+'+money(interest(p)):'—')+'</strong><small>預估利息 USD</small><div class="total">到期本息 USD<br><b>'+(valid()?money(S.principal+interest(p)):'—')+'</b></div>'+btn('以此承作','data-order="'+p.id+'" '+(!valid()?'disabled':''),'outline')+'</article>').join('')}
function risks(){return chosen().map(p=>'<div class="risk-row"><span>'+p.name+'期</span><b>'+(validFx()?breakEven(p).toFixed(4):'—')+'</b></div>').join('')}
function compare(){return header('外匯定存比較下單','list')+'<div class="app-body"><div class="box"><label class="caption" for="principal">試算本金</label><div class="amount-field"><span>USD</span><input id="principal" type="number" min="3000" step="any" value="'+(Number.isFinite(S.principal)?S.principal:'')+'" aria-describedby="principal-error"></div><p id="principal-error" class="error" '+(valid()?'hidden':'')+'>請輸入至少 USD 3,000 的本金。</p><p class="hint">相同本金套用至所有已選方案</p></div><h3>預估到期收益</h3><p class="sub">各方案天期不同，以下為各自到期收益。</p><div class="compare-grid" id="cards">'+cards()+'</div><section class="risk"><h3>盈虧平衡匯率</h3><label for="fx">買入美元的換匯成本（TWD／USD）</label><input id="fx" type="number" min="0.0001" step="0.0001" value="'+(Number.isFinite(S.fx)?S.fx:'')+'" aria-describedby="fx-error"><p class="error" id="fx-error" '+(validFx()?'hidden':'')+'>請輸入大於 0 的換匯成本。</p><p>若以新臺幣換匯承作，到期銀行買入美元的匯率需達以下數值，換回新臺幣才可收回原始本金。</p><div id="risks">'+risks()+'</div><p class="hint">以換匯成本 ÷（1 ＋ 年利率 × 月數 ÷ 12）估算，未計稅費與其他成本。已有美元者可僅參考利息收益。</p></section><p class="hint">利息為稅前簡化試算；實際計息依銀行承作條件為準。</p></div>'+actions(btn('返回調整專案','data-go="list"',''))}
function summary(p){return '<dl class="summary">'+[['承作幣別','美金 USD'],['承作金額','USD '+money(S.principal)],['承作天期',p.name],['固定年利率',p.rate.toFixed(3)+'%'],['預估利息','USD '+money(interest(p))],['到期本息','USD '+money(S.principal+interest(p))]].map(x=>'<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>').join('')+'</dl>'}
function order(){const p=PROJECTS.find(p=>p.id===S.order);return header('外匯定存比較下單','compare')+'<div class="app-body"><h3>轉存外匯定存</h3><p class="sub">已帶入您選定的方案與試算本金，請確認承作條件。</p><div class="box">'+summary(p)+'</div><p class="hint">預估利息未扣稅費。</p></div>'+actions(btn('返回修改','data-go="compare"','')+btn('確認送出','data-submit'))}
function success(){const p=PROJECTS.find(p=>p.id===S.order);return header('外匯定存比較下單')+'<div class="app-body"><div class="success" role="status"><div class="check">✓</div><h3>交易完成</h3></div><div class="box">'+summary(p)+'</div></div>'+actions(btn('重新試算','data-reset'))}
function render(){app.innerHTML=({list,compare,order,success}[S.page])();document.getElementById('flow-list').innerHTML=STEPS.map((x,i)=>'<li><button type="button" class="flow-btn" data-jump="'+x[0]+'" '+((S.page===x[0]||(S.page==='success'&&x[0]==='order'))?'aria-current="step"':'')+'><span class="no">'+(i+1)+'</span><span><strong>'+x[1]+'</strong>'+x[2]+'</span></button></li>').join('')}
function navigate(page){if(page==='compare'&&!S.selected.length){alert('請先勾選欲比較的專案。');return}if(page==='order'&&(!S.order||!valid())){alert('請先在比較頁選擇「以此承作」。');return}S.page=page;render()}
document.addEventListener('change',e=>{if(e.target.id==='tenor'){S.limit=e.target.value;const ids=visible().map(p=>p.id);S.selected=S.selected.filter(id=>ids.includes(id));S.order=null;render()}if(e.target.matches('[data-project]')){const id=e.target.dataset.project;S.selected=e.target.checked?[...S.selected,id]:S.selected.filter(x=>x!==id);S.order=null;const top=app.querySelector('.app-body').scrollTop;render();app.querySelector('.app-body').scrollTop=top}});
document.addEventListener('input',e=>{if(e.target.id==='principal'){S.principal=e.target.valueAsNumber;S.order=null;document.getElementById('cards').innerHTML=cards();document.getElementById('principal-error').hidden=valid()}if(e.target.id==='fx'){S.fx=e.target.valueAsNumber;document.getElementById('risks').innerHTML=risks();document.getElementById('fx-error').hidden=validFx()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go)navigate(b.dataset.go);if(b.dataset.jump)navigate(b.dataset.jump);if(b.dataset.order&&valid()&&S.selected.includes(b.dataset.order)){S.order=b.dataset.order;navigate('order')}if(b.hasAttribute('data-submit')&&S.order&&valid()){S.page='success';render()}if(b.id==='reset'||b.hasAttribute('data-reset')){S=fresh();render()}});
render();
</script></body></html>
